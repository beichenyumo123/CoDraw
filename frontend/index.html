<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoDraw 无人岛无限画布协同画板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background-color: #F0E6D2;
        color: #4A3728;
        overflow: hidden;
      }
      .title-font {
        font-family: 'ZCOOL KuaiLe', sans-serif;
      }
      /* 动森拟物按钮 */
      .ac-btn {
        border: 4px solid #4A3728;
        border-radius: 1rem;
        background-color: #FFFFFF;
        color: #4A3728;
        box-shadow: 4px 4px 0px 0px #4A3728;
        transition: all 0.1s ease;
      }
      .ac-btn:active:not([disabled]) {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0px 0px #4A3728;
      }
      .ac-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* Nook Phone 专属框 */
      .nook-phone {
        border: 6px solid #4A3728;
        border-radius: 3rem;
        background-color: #7BC7A5;
        box-shadow: 8px 8px 0px 0px #4A3728;
      }
      /* 自定义快捷键提示牌样式 */
      .kbd-tip {
        background-color: #FAF6EB;
        border: 2px solid #4A3728;
        box-shadow: 2px 2px 0px 0px #4A3728;
      }
    </style>
  </head>
  <body class="h-screen flex flex-col relative select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
